<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockups RP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    
    <style>
        /* Variables de paleta básica para que el mockup funcione por defecto */
        :root {
            --surface-1: #acafb3;
            --surface-2: #f8f9fa;
            --border: #e9ecef;
            --border-strong: #dee2e6;
            --text-muted: #6c757d;
            --text-secondary: #495057;
            --text-accent: #212529;
            --text-danger: #dc3545;
            --bg-accent: #f1f3f5;
            --fill-success: #198754;
            --on-success: #ffffff;
        }

        /* Reset básico para botones del mockup */
        button {
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface-1);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: inherit;
        }
        
        select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-strong);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>

<body>
    <div style="background: var(--surface-1); border-radius: 12px; padding: 2rem 1rem; display: flex; justify-content: center;">
        <h2 class="sr-only">Mockup de app móvil para mostrar códigos QR de pago de una cafetería y librería, con selección de actividad, tipo de pago y sección de configuración.</h2>
        
        <div style="width: 320px; background: var(--surface-2); border-radius: 28px; border: 0.5px solid var(--border-strong); overflow: hidden; position: relative; min-height: 560px; display: flex; flex-direction: column;">
            
            <div id="header" style="display:flex; align-items:center; gap:10px; padding:14px 14px; background: var(--surface-1); border-bottom: 0.5px solid var(--border);"></div>
            
            <div id="content" style="flex:1; padding:16px; position:relative;"></div>

            <div id="drawer" style="position:absolute; inset:0; background:rgba(0,0,0,0.35); display:none; z-index: 10;">
                <div style="width:220px; height:100%; background:var(--surface-2); padding:16px 12px; display:flex; flex-direction:column; gap:4px;">
                    <div style="font-size:13px; color:var(--text-muted); padding:6px 8px 12px;">Menú</div>
                    <button onclick="goTo('config')" style="justify-content:flex-start; display:flex; align-items:center; gap:10px; text-align:left;"><i class="ti ti-settings" style="font-size:18px" aria-hidden="true"></i>Configuración</button>
                    <button onclick="goTo('acerca')" style="justify-content:flex-start; display:flex; align-items:center; gap:10px; text-align:left;"><i class="ti ti-info-circle" style="font-size:18px" aria-hidden="true"></i>Acerca de</button>
                    <button onclick="toggleMenu()" style="justify-content:flex-start; display:flex; align-items:center; gap:10px; text-align:left; color:var(--text-danger);"><i class="ti ti-logout" style="font-size:18px" aria-hidden="true"></i>Salir</button>
                </div>
            </div>

            <div style="display:flex; justify-content:center; gap:18px; padding:10px; border-top:0.5px solid var(--border); background:var(--surface-1);">
                <i class="ti ti-triangle" style="font-size:14px; color:var(--text-muted); transform:rotate(-90deg)" aria-hidden="true"></i>
                <i class="ti ti-circle" style="font-size:14px; color:var(--text-muted)" aria-hidden="true"></i>
                <i class="ti ti-square" style="font-size:12px; color:var(--text-muted)" aria-hidden="true"></i>
            </div>
        </div>
    </div>

    <script>
        const state = { activity: null, tipo: null, screen: 'main' };
        const hist = ['main'];

        const actividadInfo = {
            Libreria: { color: 'c-blue', icon: 'ti-book' },
            Cafeteria: { color: 'c-coral', icon: 'ti-cup' }
        };
        
        const tipoInfo = {
            'Con factura': 'ti-file-invoice',
            'Sin factura': 'ti-receipt'
        };

        function toggleMenu(){
            const d = document.getElementById('drawer');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
        }

        function goTo(screen, push){
            if(push !== false) hist.push(screen);
            state.screen = screen;
            document.getElementById('drawer').style.display = 'none';
            render();
        }

        function back(){
            hist.pop();
            state.screen = hist[hist.length-1] || 'main';
            render();
        }

        function selectActivity(a){
            state.activity = a;
            goTo('tipo');
        }

        function selectTipo(t){
            state.tipo = t;
            goTo('qr');
        }

        function render(){
            const header = document.getElementById('header');
            const content = document.getElementById('content');
            let title = '', showBack = state.screen !== 'main';
            let html = '';

            if(state.screen === 'main'){
                title = 'Seleccioná una actividad';
                html = groupCard('Libreria') + groupCard('Cafeteria');
            }
            else if(state.screen === 'tipo'){
                title = state.activity + ' · tipo de pago';
                html = ['Con factura','Sin factura'].map(t =>
                    groupBtn(t, tipoInfo[t], actividadInfo[state.activity].color, "selectTipo('"+t+"')")
                ).join('');
            }
            else if(state.screen === 'qr'){
                title = state.activity + ' · ' + state.tipo;
                html = '<div style="display:flex; flex-direction:column; align-items:center; gap:16px; padding-top:8px;">' +
                    '<div style="width:200px; height:200px; border-radius:12px; background:var(--surface-1); border:0.5px solid var(--border); display:flex; align-items:center; justify-content:center;">' +
                        '<i class="ti ti-qrcode" style="font-size:96px; color:var(--text-muted);" aria-hidden="true"></i>' +
                    '</div>' +
                    '<div style="text-align:center;">' +
                        '<p style="font-size:14px; font-weight:500; margin:0;">'+ state.activity +'</p>' +
                        '<p style="font-size:13px; color:var(--text-secondary); margin:2px 0 0;">'+ state.tipo +'</p>' +
                    '</div>' +
                '</div>';
            }
            else if(state.screen === 'config'){
                title = 'Configuración';
                html = navRow('ti-adjustments', 'Actividades y tipos de QR', "goTo('configGestion')") +
                       navRow('ti-photo', 'Imágenes QR', "goTo('configImagenes')");
            }
            else if(state.screen === 'configGestion'){
                title = 'Actividades y tipos';
                html = sectionLabel('Actividades') +
                    configItem('Libreria', 'Pagos a librería') +
                    configItem('Cafeteria', 'Pagos a cafetería') +
                    sectionLabel('Tipos de QR') +
                    configItem('Con factura', 'Pagos con factura') +
                    configItem('Sin factura', 'Pagos sin factura') +
                    '<button style="width:100%; display:flex; align-items:center; justify-content:center; gap:6px; margin-top:8px;"><i class="ti ti-plus" style="font-size:16px" aria-hidden="true"></i>Agregar</button>';
            }
            else if(state.screen === 'configImagenes'){
                title = 'Imágenes QR';
                html =
                    field('Actividad', '<select><option>Libreria</option><option>Cafeteria</option></select>') +
                    field('Tipo de QR', '<select><option>Con factura</option><option>Sin factura</option></select>') +
                    '<button style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin:8px 0 16px; border-style:dashed;"><i class="ti ti-upload" style="font-size:16px" aria-hidden="true"></i>Cargar imagen</button>' +
                    saveBtn();
            }
            else if(state.screen === 'acerca'){
                title = 'Acerca de';
                html = '<div style="background:var(--surface-1); border-radius:12px; padding:16px; text-align:center;">' +
                    '<i class="ti ti-qrcode" style="font-size:32px; color:var(--text-accent);" aria-hidden="true"></i>' +
                    '<p style="font-size:15px; font-weight:500; margin:12px 0 2px;">Bylaba projects 2026</p>' +
                    '<p style="font-size:13px; color:var(--text-secondary); margin:0 0 16px;">Container QR</p>' +
                    '<a href="https://example.com" target="_blank" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-accent); text-decoration:none;"><i class="ti ti-external-link" style="font-size:14px" aria-hidden="true"></i>Ir a sitio web</a>' +
                '</div>';
            }

            header.innerHTML =
                (showBack ? '<button onclick="back()" aria-label="Volver" style="width:32px; height:32px; padding:0; border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-chevron-left" style="font-size:18px" aria-hidden="true"></i></button>'
                    : '<button onclick="toggleMenu()" aria-label="Menú" style="width:32px; height:32px; padding:0; border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="ti ti-menu-2" style="font-size:18px" aria-hidden="true"></i></button>') +
                '<span style="font-size:14px; font-weight:500;">' + title + '</span>';

            content.innerHTML = html;
        }

        function groupCard(activity){
            const info = actividadInfo[activity];
            return '<button onclick="selectActivity(\''+activity+'\')" class="'+info.color+'" style="width:100%; display:flex; align-items:center; gap:12px; padding:16px; margin-bottom:12px; border-radius:12px; border:none; background:var(--bg-accent); text-align:left; color:var(--text-accent);">' +
                '<i class="ti '+info.icon+'" style="font-size:24px;" aria-hidden="true"></i>' +
                '<span style="font-size:15px; font-weight:500;">'+activity+'</span>' +
            '</button>';
        }

        function groupBtn(label, icon, colorClass, onclick){
            return '<button onclick="'+onclick+'" class="'+colorClass+'" style="width:100%; display:flex; align-items:center; gap:12px; padding:16px; margin-bottom:12px; border-radius:12px; border:none; background:var(--bg-accent); text-align:left; color:var(--text-accent);">' +
                '<i class="ti '+icon+'" style="font-size:22px;" aria-hidden="true"></i>' +
                '<span style="font-size:15px; font-weight:500;">'+label+'</span>' +
            '</button>';
        }

        function navRow(icon, label, onclick){
            return '<button onclick="'+onclick+'" style="width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px; margin-bottom:10px;">' +
                '<span style="display:flex; align-items:center; gap:10px; font-size:14px;"><i class="ti '+icon+'" style="font-size:18px" aria-hidden="true"></i>'+label+'</span>' +
                '<i class="ti ti-chevron-right" style="font-size:16px; color:var(--text-muted)" aria-hidden="true"></i>' +
            '</button>';
        }

        function sectionLabel(text){
            return '<p style="font-size:12px; color:var(--text-muted); margin:12px 0 6px;">'+text+'</p>';
        }

        function configItem(name, desc){
            return '<div style="background:var(--surface-1); border-radius:10px; padding:10px 12px; margin-bottom:8px;">' +
                '<p style="font-size:13px; font-weight:500; margin:0 0 2px;">'+name+'</p>' +
                '<p style="font-size:12px; color:var(--text-secondary); margin:0 0 8px;">'+desc+'</p>' +
                '<button style="display:flex; align-items:center; gap:6px; padding:6px 10px; font-size:12px;"><i class="ti ti-device-floppy" style="font-size:14px" aria-hidden="true"></i>Guardar</button>' +
            '</div>';
        }

        function field(label, input){
            return '<label style="display:block; font-size:12px; color:var(--text-secondary); margin:0 0 4px;">'+label+'</label>' +
                '<div style="margin-bottom:12px;">'+input+'</div>';
        }

        function saveBtn(){
            return '<button style="width:100%; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--fill-success); color:var(--on-success); border:none;"><i class="ti ti-device-floppy" style="font-size:16px" aria-hidden="true"></i>Guardar/Actualizar</button>';
        }

        // Ejecutar primer renderizado
        render();
    </script>
</body>

</html>
